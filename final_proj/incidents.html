function getlink(feature) {
    const link = feature.properties.Link;

    if (!link || link.trim() === "") {
        return "No link available";
    }

    return link;
}


function getdate(feature) {
    const date = feature.properties.display_date;

    if (!date || date.trim() === "") {
        return "No Date available";
    }

    return date;
}

function gettags(feature) {
    const tag = feature.properties.Tags;

    if (!tag || tag.trim() === "") {
        return "No Event Type available";
    }

    return tag;
}

function showEventInfoInPanel(feature) {
    panel.innerHTML = `
        <h4>Date of Incident</h4>
        <p>${getdate(feature)}</p>
        <h4>Event Type</h4>
        <p>${gettags(feature)}</p>
        <h4>Media Link</h4>
        <p>${getlink(feature)}</p>
    `;
}


//with the help of AI
function getNotes(feature) {

}

}
